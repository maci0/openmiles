name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for a tag that already exists, without deleting and
  # re-pushing it. A failed run (runner outage, a flaky download) is otherwise
  # only retryable by moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-run, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  # Keyed on the tag, not the ref, so a manual re-run cannot race the push
  # trigger for the same release.
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read-only for the whole workflow. Only the release-creation step needs
# write, and it asks for it below: a credential every other step in the job can
# reach is a credential a vendored header, a build script, or a stray test
# artifact can use.
permissions:
  contents: read

jobs:
  build:
    name: Build Windows DLL
    runs-on: ubuntu-latest
    # The job compiles the tree four times over: the test bundle, the shipped
    # cross-compile, the reproducibility rebuild under a second path, and the
    # C header parity compile. 15 minutes turned that budget into the first
    # thing to break on a slow runner, and a job killed at the ceiling reports
    # no failed step at all, only a timeout.
    timeout-minutes: 30
    env:
      # The tag being released, on a push and on a manual re-run alike.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # TAG is a checkout ref and is spliced into shell words by every step
      # below, and on a manual re-run it is whatever the dispatch input held. A
      # git ref carries none of what a shell word does, so anything that is not
      # v<major>.<minor>.<patch> is a typo or an attempt at one, and it is
      # refused here, before the value selects a tree to build and publish.
      - name: Reject a tag that is not a version
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)*$ ]]; then
            echo "tag '${TAG}' is not v<major>.<minor>.<patch>"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Nothing in this job pushes over git: the release is created with
          # GH_TOKEN, and the rebuild step reads tracked paths with
          # `git ls-files`. Leaving the job token in .git/config would hand every
          # step in the job a credential none of them need.
          persist-credentials: false

      # A release is only correct if the tag, the declared package version, and
      # the changelog agree. build.zig.zon is the single source of truth: the tag
      # must carry exactly the version declared there, so a release can never be
      # published under a name the package does not claim.
      - name: Verify tag matches build.zig.zon version
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)
          tag="${TAG#v}"
          if [ -z "$declared" ]; then
            echo "no .version found in build.zig.zon"; exit 1
          fi
          if [ "$declared" != "$tag" ]; then
            echo "tag ${TAG} does not match build.zig.zon version ${declared}"
            echo "set .version = \"${tag}\" in build.zig.zon and re-tag"
            exit 1
          fi
          if ! grep -qF "## [${tag}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${tag}]' section"
            echo "move the Unreleased notes under one before tagging"
            exit 1
          fi
          echo "releasing ${declared}"

      # A published version is immutable: the tag, the archive under it, and
      # the checksum beside it are what a consumer has already pinned. This
      # check runs on both triggers, not only the manual re-run. A
      # workflow_dispatch exists for a run that failed before it published, and
      # a re-pushed tag reaches the same state, so either one finds a release
      # for the tag and stops. Publishing over it would replace bytes a
      # consumer may have fetched and recorded against SHA256SUMS, and
      # action-gh-release updates an existing release without complaint.
      # Publish the fix as a new version instead.
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; a published version is not republished"
            echo "bump .version in build.zig.zon and tag the new version"
            exit 1
          fi
          echo "no release published for ${TAG} yet"

      # build.zig.zon declares the toolchain once; CI and the Makefile read the
      # same field, so a Zig bump cannot land in one place and miss the others.
      - name: Read pinned Zig version
        id: zig
        run: |
          set -euo pipefail
          v=$(sed -n 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)
          [ -n "$v" ] || { echo "no .minimum_zig_version in build.zig.zon" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ~/.local/share/zig
          # The toolchain version is part of the key, and the restore prefix
          # keeps it too: a Zig bump invalidates the cache instead of
          # restoring another version's global cache, while a build.zig.zon
          # edit (which rarely changes the toolchain) still hits the cache.
          key: ${{ runner.os }}-zig-${{ steps.zig.outputs.version }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ steps.zig.outputs.version }}-

      # A tag is published from this job with no merge gate in between, so the
      # analyzer set `make lint` runs has to run here too: a release cut from a
      # commit the CI gate refused, or re-run after one of the linters moved,
      # would otherwise publish a tree the merge gate says is not shippable.
      # shellcheck is on the runner image, as it is for the CI job.
      - name: Install the pinned linters
        run: |
          set -euo pipefail
          # Read both pins from the Makefile rather than repeating them, so the
          # only copy is the one check-pins already watches.
          ruff_version=$(sed -n 's/^RUFF_VERSION := //p' Makefile)
          yamllint_version=$(sed -n 's/^YAMLLINT_VERSION := //p' Makefile)
          [ -n "$ruff_version" ] && [ -n "$yamllint_version" ] || {
            echo "no RUFF_VERSION or YAMLLINT_VERSION in the Makefile" >&2
            exit 1
          }
          pipx install uv==0.12.19
          uv tool install "ruff==${ruff_version}"
          uv tool install "yamllint==${yamllint_version}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint (zig fmt, ruff, shellcheck, yamllint, gate parity, pins)
        run: make lint

      - name: Run Tests
        run: zig build test

      # deps/ is vendored upstream source, not a package-manager download, so
      # nothing else in the tree records which bytes went into the DLL. A header
      # edited in place after review would otherwise ship unnoticed.
      - name: Verify vendored dependencies
        run: ./scripts/check_vendored.py

      # The SBOM travels in the release archive, so it has to describe the tree
      # the tag carries: regenerating it here is the only way to know it is not
      # an inventory left over from an earlier set of headers.
      - name: Verify the SBOM matches the tree
        run: ./scripts/gen_sbom.py --check

      # The published DLL is a drop-in for the C surface src/mss.h declares, so
      # the export table is checked against that header here too, not only on
      # the merge that produced the tag.
      - name: Verify C header matches the export table
        run: ./scripts/check_header.py

      - name: Cross-compile Windows DLL
        run: zig build -Dtarget=x86-windows -Doptimize=ReleaseFast

      # The shipped artifact is a drop-in mss32.dll: a game that cannot resolve
      # an import it links against fails to start. Check the built DLL itself
      # (not the source table) is 32-bit PE and still exports the core entry
      # points a game links before any of them is published.
      - name: Smoke-test the built DLL
        run: |
          set -euo pipefail
          dll=zig-out/bin/mss32.dll
          test -s "$dll" || { echo "missing or empty $dll"; exit 1; }
          hdr=$(objdump -f "$dll")
          grep -q 'pei-i386' <<<"$hdr" || { echo "not a 32-bit PE:"; echo "$hdr"; exit 1; }
          exports=$(objdump -p "$dll")
          for sym in AIL_startup AIL_shutdown AIL_open_stream AIL_set_sample_position AIL_start_sample; do
            if ! grep -Eq "(^|[[:space:]_])${sym}@" <<<"$exports"; then
              echo "missing required export: $sym"; exit 1
            fi
          done

      # The archive check below re-packages the DLL that is already on disk, so
      # it proves zip determinism and nothing about the compile. This step is
      # the one that proves the compile: a pristine copy of the tag is built
      # again under a different absolute path, timezone and locale, and the two
      # DLLs have to match byte for byte. A path, a clock or a collation that
      # leaked into the image shows up here and nowhere else.
      - name: Verify the DLL rebuilds identically
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/rebuild"
          rm -rf "$mirror"; mkdir -p "$mirror"
          # git ls-files, not a cp of the checkout: the working tree holds
          # zig-out/ and .zig-cache/, and shipping either into the mirror would
          # compare a fresh build against a cached one.
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$mirror"
          # The global cache stays warm on purpose: it is content addressed, so
          # a hit is a legitimate reproduction, and a cold one would spend the
          # job's whole timeout rebuilding libc. The local cache is the
          # working tree's, and this mirror has none.
          cd "$mirror"
          TZ=Asia/Tokyo LC_ALL=C.UTF-8 zig build \
            -Dtarget=x86-windows -Doptimize=ReleaseFast
          cmp "$mirror/zig-out/bin/mss32.dll" "$GITHUB_WORKSPACE/zig-out/bin/mss32.dll"
          echo "mss32.dll is byte-identical from a second path, timezone and locale"

      # VENDORED.md, DEPS-SHA256SUMS, and SBOM.cdx.json travel with the DLL: the
      # project license covers redistribution of the vendored headers under their
      # own terms, and a consumer who wants to trace that grant back to an
      # upstream release needs the attribution and the digests, not just this
      # repository's URL. The checksums are written from the packaging script's
      # own entry list, so they name exactly the files the archive holds.
      - name: Package release
        run: ./scripts/package_release.sh "openmiles-${TAG}-win32.zip" release/SHA256SUMS

      - name: Verify the archive is reproducible
        run: |
          set -euo pipefail
          # Packaged a second time and compared byte for byte. The archive must
          # depend on the staged entries and their epoch alone, so anything the
          # packaging host contributes (a timezone reaching the MS-DOS entry
          # timestamps, a locale reordering a sort, a filesystem directory
          # order rather than the explicit entry list) shows up as a diff here.
          # package_release.sh exports TZ=UTC and LC_ALL=C for itself and every
          # child it spawns, so a caller cannot reintroduce host dependence by
          # exporting its own; the step that does vary the timezone and locale
          # is the rebuild above, which wraps zig build rather than the script.
          # The script cd's to the repository root itself, so the output path
          # has to be absolute to land outside the tree.
          ./scripts/package_release.sh "$RUNNER_TEMP/repeat.zip"
          cmp "openmiles-${TAG}-win32.zip" "$RUNNER_TEMP/repeat.zip"
          rm "$RUNNER_TEMP/repeat.zip"

      # The release body a consumer reads is the curated `## [<version>]`
      # section the tag check above already required, not the commit list
      # GitHub generates: a generated body names commits and never says which
      # export table changed or what a consumer has to do about it.
      - name: Build the release notes from the changelog section
        run: |
          set -euo pipefail
          # The changelog heading names the version, not the tag, so the 'v' the
          # tag carries is stripped here exactly as the tag check above strips
          # it. The heading also carries its release date ("## [0.1.0] - ..."),
          # so the section is matched on its prefix rather than on the whole
          # line, which is why the version alone used to extract an empty body.
          version="${TAG#v}"
          mkdir -p release
          awk -v heading="## [${version}]" '
            substr($0, 1, length(heading)) == heading { body = 1; next }
            body && /^## \[/ { exit }
            body { print }
          ' CHANGELOG.md > release/NOTES.md
          if [ ! -s release/NOTES.md ]; then
            echo "CHANGELOG.md section for ${version} is empty"
            exit 1
          fi
          head -1 release/NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        # The one step in the job that writes to the repository. Every step
        # above it runs with the workflow's read-only token.
        permissions:
          contents: write
        with:
          # Named explicitly: on a manual re-run github.ref is the branch the
          # workflow was dispatched from, not the tag being released.
          tag_name: ${{ env.TAG }}
          files: |
            openmiles-${{ env.TAG }}-win32.zip
            release/SHA256SUMS
          body_path: release/NOTES.md
          # A release published with no assets is a silent failure: the action
          # skips a glob that matched nothing and reports success.
          fail_on_unmatched_files: true
