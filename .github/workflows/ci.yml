name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Ubuntu leg runs the full gate: lint, the native build, the test
    # bundle, a sanitizer rebuild of every C translation unit, and the Windows
    # cross-compile. That is five full compiles of the tree, and 15 minutes made
    # a slow runner the first thing to fail, with no failed step to point at.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No step in this job pushes over git, and the job token is read-only
          # anyway, so it has no business sitting in .git/config for the run.
          persist-credentials: false

      # build.zig.zon declares the toolchain once; the Makefile and the release
      # workflow read the same field, so a Zig bump cannot land in one place
      # and miss the others.
      - name: Read pinned Zig version
        id: zig
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)
          [ -n "$v" ] || { echo "no .minimum_zig_version in build.zig.zon" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406  # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Cache Zig global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ~/.local/share/zig
            ~/AppData/Local/zig
            ~/Library/Caches/zig
          # The toolchain version is part of the key, and the restore prefix
          # keeps it too: a Zig bump invalidates the cache instead of
          # restoring another version's global cache, while a build.zig.zon
          # edit (which rarely changes the toolchain) still hits the cache.
          key: ${{ runner.os }}-zig-${{ steps.zig.outputs.version }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ steps.zig.outputs.version }}-

      # The three pins below are read out of the Makefile rather than typed
      # here, the way release.yml reads them, so a version is declared once
      # and scripts/check_toolchain_pins.py fails a workflow that repeats one.
      #
      # The runner image ships no uv, so without this step the first `uv tool
      # install` fails the ubuntu leg with exit 127 before any gate runs.
      # setup-uv puts uv on PATH; ~/.local/bin, where the two install steps
      # below put their tools, is added here too, because an entry appended to
      # GITHUB_PATH applies only to the steps after the one that writes it.
      - name: Read the uv pin
        id: uv-pin
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^UV_VERSION := //p' Makefile)
          [ -n "$version" ] || { echo "no UV_VERSION in the Makefile" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ steps.uv-pin.outputs.version }}
          # no uv.lock to key a cache on; the tools install from the index
          enable-cache: false

      - name: Install ruff
        if: matrix.os == 'ubuntu-latest'
        # The RUFF_VERSION in the Makefile, so the local gate and CI run the
        # same analyzer; `make lint` refuses any other version.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^RUFF_VERSION := //p' Makefile)
          [ -n "$version" ] || { echo "no RUFF_VERSION in the Makefile" >&2; exit 1; }
          uv tool install "ruff==${version}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install yamllint
        if: matrix.os == 'ubuntu-latest'
        # The YAMLLINT_VERSION in the Makefile, same reason as the ruff above.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^YAMLLINT_VERSION := //p' Makefile)
          [ -n "$version" ] || { echo "no YAMLLINT_VERSION in the Makefile" >&2; exit 1; }
          uv tool install "yamllint==${version}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint (zig fmt + ruff + shellcheck + yamllint + C header parity, same rules as `make lint`)
        if: matrix.os == 'ubuntu-latest'
        run: make lint

      - name: Build
        run: zig build

      - name: Run Tests
        # --summary all is what `make test` asks for, and the reason is in the
        # Makefile: zig 0.16 prints a "failed command: ... --listen=-" line after
        # a test artifact writes to stderr and still exits 0, so an unannotated
        # run ends on a line that reads as a failure and the "N/N tests passed"
        # line that settles it never appears.
        run: zig build test --summary all

      - name: Run Tests (C undefined-behaviour sanitizer)
        if: matrix.os == 'ubuntu-latest'
        # -Dsanitize instruments every C translation unit, so it rebuilds the
        # tree and runs minutes slower than the step above; a separate step on
        # the Linux leg keeps it off the Windows matrix and off the critical
        # path of an ordinary `zig build test`. A finding here is a real
        # undefined-behaviour report: the run fails, nothing is suppressed.
        run: make sanitize

      - name: Run native plugin harness
        if: matrix.os == 'ubuntu-latest'
        # native_rib_test reaches the dlopen path the test bundle cannot (it
        # links musl statically, where dlopen is a stub). It is a `make check`
        # step, so CI runs it here too. Ubuntu only, the leg where it has been
        # run: the Windows leg builds the same executable but `make` is not on
        # the runner, which is the same reason the other make targets are gated
        # on this leg.
        run: make harnesses

      - name: Cross-compile Windows DLL
        if: matrix.os == 'ubuntu-latest'
        run: zig build -Dtarget=x86-windows -Doptimize=ReleaseFast

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openmiles-artifacts-${{ matrix.os }}
          # zig-out/include is the third install directory the build produces
          # (b.installFile of src/mss.h in build.zig), and the release
          # packager stages it as the archive's mss.h entry. An artifact that
          # carried only the library and the binaries could not be packaged
          # into a release without rebuilding the header first.
          path: |
            zig-out/lib/
            zig-out/bin/
            zig-out/include/
          retention-days: 7
          # A build that produced nothing must not pass as a green upload.
          if-no-files-found: error
